<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#300505"/>
      <stop offset="55%" stop-color="#150202"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2222" stop-opacity="0.36"/>
      <stop offset="55%" stop-color="#FF2222" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FF2222" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body" cx="38%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#FF9A9A"/>
      <stop offset="30%" stop-color="#FF2222"/>
      <stop offset="68%" stop-color="#B80F0F"/>
      <stop offset="100%" stop-color="#660404"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bg)"/>

  <!-- Аура вокруг существа -->
  <circle cx="250" cy="255" r="200" fill="url(#aura)" filter="url(#glow)"/>

  <!-- Искры-осколки -->
  <g fill="#FF5555" opacity="0.5">
    <path d="M 78 120 L 84 110 L 90 120 L 84 130 Z"/>
    <path d="M 420 105 L 426 95 L 432 105 L 426 115 Z"/>
    <circle cx="120" cy="360" r="2"/>
    <circle cx="60" cy="240" r="1.8"/>
  </g>

  <!-- Магическое кольцо -->
  <circle cx="250" cy="255" r="168" fill="none" stroke="#FF2222" stroke-opacity="0.28" stroke-width="1.6" stroke-dasharray="3 10"/>
  <circle cx="250" cy="255" r="182" fill="none" stroke="#FF2222" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Тело -->
  <circle cx="250" cy="260" r="120" fill="url(#body)"/>

  <!-- Блик -->
  <ellipse cx="212" cy="205" rx="44" ry="24" fill="#ffffff" opacity="0.3" transform="rotate(-28 212 205)"/>

  <!-- Нахмуренные брови -->
  <path d="M 190 232 L 228 246" stroke="#2a0000" stroke-width="9" stroke-linecap="round"/>
  <path d="M 310 232 L 272 246" stroke="#2a0000" stroke-width="9" stroke-linecap="round"/>

  <!-- Злые глаза (полукруги) -->
  <g fill="#2a0000">
    <circle cx="207" cy="262" r="14"/>
    <circle cx="293" cy="262" r="14"/>
  </g>
  <!-- Блики глаз -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="202" cy="258" r="3.5"/>
    <circle cx="298" cy="258" r="3.5"/>
  </g>

  <!-- Кривая ухмылка с клыком -->
  <path d="M 196 302 Q 250 310 316 288" fill="none" stroke="#2a0000" stroke-width="8" stroke-linecap="round"/>
  <!-- Клык -->
  <path d="M 306 282 L 310 296 L 316 288 Z" fill="#ffffff"/>
  <!-- Линия ухмылки -->
  <path d="M 310 300 L 322 292" stroke="#2a0000" stroke-width="8" stroke-linecap="round"/>
</svg>