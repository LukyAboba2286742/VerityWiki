<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#001533"/>
      <stop offset="55%" stop-color="#000614"/>
      <stop offset="100%" stop-color="#050607"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0055FF" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#0055FF" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#0055FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body" cx="38%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#9DBBFF"/>
      <stop offset="30%" stop-color="#0055FF"/>
      <stop offset="68%" stop-color="#00339B"/>
      <stop offset="100%" stop-color="#001A4F"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bg)"/>

  <!-- Аура вокруг существа -->
  <circle cx="250" cy="255" r="200" fill="url(#aura)" filter="url(#glow)"/>

  <!-- Ледяные искры -->
  <g fill="#7FA8FF" opacity="0.5">
    <circle cx="78" cy="120" r="2.5"/>
    <circle cx="120" cy="360" r="2"/>
    <circle cx="420" cy="105" r="2.5"/>
    <circle cx="388" cy="330" r="2"/>
    <circle cx="60" cy="240" r="1.8"/>
  </g>

  <!-- Магическое кольцо -->
  <circle cx="250" cy="255" r="168" fill="none" stroke="#0055FF" stroke-opacity="0.28" stroke-width="1.6" stroke-dasharray="3 10"/>
  <circle cx="250" cy="255" r="182" fill="none" stroke="#0055FF" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Тело -->
  <circle cx="250" cy="260" r="120" fill="url(#body)"/>

  <!-- Блик -->
  <ellipse cx="212" cy="205" rx="44" ry="24" fill="#ffffff" opacity="0.22" transform="rotate(-28 212 205)"/>

  <!-- Пустые глаза (без бликов) -->
  <g>
    <circle cx="207" cy="258" r="15" fill="#E8EEFF" opacity="0.92"/>
    <circle cx="293" cy="258" r="15" fill="#E8EEFF" opacity="0.92"/>
    <circle cx="207" cy="261" r="7" fill="#001A4F"/>
    <circle cx="293" cy="261" r="7" fill="#001A4F"/>
  </g>

  <!-- Грустный рот (перевёрнутая дуга) -->
  <path d="M 208 312 Q 250 280 292 312" fill="none" stroke="#E8EEFF" stroke-width="8" stroke-linecap="round" opacity="0.9"/>

  <!-- Капля меланхолии -->
  <path d="M 330 240 Q 338 254 338 262 A 8 8 0 1 1 322 262 Q 322 254 330 240 Z" fill="#BFD4FF" opacity="0.85"/>
</svg>